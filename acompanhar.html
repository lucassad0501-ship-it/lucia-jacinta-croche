<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar encomenda | Lúcia Jacinta Crochê</title><link rel="stylesheet" href="style.css?v=466"><style>body{background:#fff8f7}.track-wrap{max-width:640px;margin:35px auto;padding:20px}.track-card{background:#fff;border:1px solid #eadfe1;border-radius:22px;padding:25px;box-shadow:0 8px 30px #6336490a}.track-card h1{font:700 clamp(26px,6vw,38px) Georgia,serif;color:#633649}.track-card label{display:block;margin:15px 0 6px;font-weight:600}.track-card input{width:100%;box-sizing:border-box}.track-card button{width:100%;margin-top:18px}.track-result{margin-top:20px;border-radius:15px;background:#fff6f9;padding:18px;line-height:1.7}.track-steps{display:grid;gap:8px;margin:12px 0}.track-step{padding:10px;border-radius:10px;background:#f2edf0;color:#796e73}.track-step.done{background:#e6f5ea;color:#236c42}.track-step.current{outline:2px solid #a96783;font-weight:700}.track-note{font-size:13px;color:#6d5962}a{color:#8d506a}</style></head><body><header class="header"><a href="/" class="brand"><img src="assets/logo.jpg" alt=""><span><strong>Lúcia Jacinta</strong><small>CROCHÊ ARTESANAL</small></span></a><a href="/">Voltar à loja</a></header><main class="track-wrap"><section class="track-card"><h1>📦 Acompanhar meu pedido</h1><p>Consulte a situação do pagamento e da sua encomenda.</p><form id="trackForm"><label for="code">Código do pedido</label><input class="field" id="code" required placeholder="Ex.: b4387d20-..." autocomplete="off"><label for="phone">WhatsApp usado na compra</label><input class="field" id="phone" type="tel" inputmode="tel" required placeholder="DDD + número" autocomplete="tel"><button class="btn" id="lookup" type="submit">Consultar meu pedido</button></form><div id="result" class="track-result" role="status" aria-live="polite" hidden></div><p class="track-note">Por segurança, o código e o WhatsApp precisam corresponder ao mesmo pedido. O pagamento só é confirmado após a aprovação do Mercado Pago.</p></section></main><script>(()=>{'use strict';const $=x=>document.getElementById(x);const qs=new URLSearchParams(location.search);if(qs.get('id'))$('code').value=qs.get('id');const names={recebido:'Pedido recebido',producao:'Em produção',pronto:'Pronto para envio',enviado:'Enviado',entregue:'Entregue'};const stages=Object.keys(names);$('trackForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('code').value.trim(),phone=$('phone').value.replace(/\D/g,'');const el=$('result');el.hidden=false;el.textContent='Consultando pedido...';$('lookup').disabled=true;try{const r=await fetch('/api/status-pedido?tracking=1&id='+encodeURIComponent(id)+'&phone='+encodeURIComponent(phone),{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Não foi possível consultar');const payment={approved:'✅ Pagamento confirmado',pending:'⏳ Aguardando pagamento',rejected:'❌ Pagamento recusado',cancelled:'❌ Pagamento cancelado',refunded:'↩️ Pagamento estornado'}[data.status]||'⏳ Pagamento em análise';el.replaceChildren();const title=document.createElement('strong');title.textContent=payment;el.append(title);if(data.status==='approved'){const heading=document.createElement('p');heading.textContent='Andamento da encomenda:';el.append(heading);const list=document.createElement('div');list.className='track-steps';const n=stages.indexOf(data.andamento);stages.forEach((stage,i)=>{const step=document.createElement('div');step.className='track-step'+(i<=n?' done':'')+(i===n?' current':'');step.textContent=(i<=n?'✓ ':'○ ')+names[stage];list.append(step)});el.append(list)}else{const note=document.createElement('p');note.textContent='O andamento da produção ficará disponível após a confirmação do pagamento.';el.append(note)}}catch(err){el.textContent=err.message}finally{$('lookup').disabled=false}})})();</script></body></html>
