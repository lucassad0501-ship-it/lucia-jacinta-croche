<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f7"><title>Status do pagamento | Lúcia Jacinta Crochê</title><link rel="stylesheet" href="style.css?v=461"></head><body><main class="section" style="max-width:650px;margin:8vh auto;text-align:center"><div style="font-size:48px" id="symbol">⏳</div><h1 id="title">Aguardando confirmação do pagamento</h1><p id="message">Estamos consultando a confirmação oficial do Mercado Pago. Se você pagou com Pix, isso pode levar alguns instantes.</p><p id="detail" style="font-size:14px;opacity:.75"></p><a class="btn" href="/">Voltar à loja</a> <a class="btn" href="https://wa.me/5561994022266" rel="noopener">Falar com a loja</a></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),id=query.get('order_id')||sessionStorage.getItem('lj-pedido-atual')||'',valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);let count=0;
function show(symbol,title,message,detail=''){$('symbol').textContent=symbol;$('title').textContent=title;$('message').textContent=message;$('detail').textContent=detail}
if(!valid){show('🧾','Consulte seu pagamento','Não encontramos o identificador do pedido neste navegador. Se você pagou, consulte a compra no Mercado Pago ou fale com a loja.');return}
async function check(){try{const r=await fetch('/api/status-pedido?id='+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw Error('Falha na consulta');const data=await r.json();if(data.status==='approved'){show('✅','Pagamento confirmado!','Seu pagamento foi aprovado pelo Mercado Pago. Obrigado por comprar na Lúcia Jacinta Crochê!');sessionStorage.removeItem('lj-pedido-atual');localStorage.removeItem('lj-cart-v35');return}if(data.status==='rejected'||data.status==='cancelled'){show('⚠️','Pagamento não aprovado','O pagamento foi recusado ou cancelado. Você pode voltar à loja e tentar novamente.');return}if(data.status==='refunded'){show('↩️','Pagamento devolvido','O pagamento foi estornado. Entre em contato com a loja.');return}show('⏳','Aguardando confirmação do pagamento','Seu pedido foi registrado. Assim que o Mercado Pago confirmar o pagamento, esta tela será atualizada automaticamente.')}catch{show('⏳','Verificando pagamento','Não foi possível consultar a confirmação agora. Você pode aguardar ou consultar sua compra no Mercado Pago.')}
if(++count<120)setTimeout(check,5000);else $('detail').textContent='Se a confirmação demorar, consulte seu pagamento no Mercado Pago ou entre em contato com a loja.'}
check();
})();
</script></body></html>
