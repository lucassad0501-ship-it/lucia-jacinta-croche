<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f7"><title>Status do pagamento | Lúcia Jacinta Crochê</title><link rel="stylesheet" href="style.css?v=461"></head><body><main class="section" style="max-width:650px;margin:8vh auto;text-align:center"><div style="font-size:48px" id="symbol">⏳</div><h1 id="title">Aguardando confirmação do pagamento</h1><p id="message">Estamos consultando a confirmação oficial do Mercado Pago. Se você pagou com Pix, isso pode levar alguns instantes.</p><p id="detail" style="font-size:14px;opacity:.75"></p><section id="orderSummary" hidden style="text-align:left;background:white;border:1px solid #eadfe1;border-radius:16px;padding:18px;margin:20px 0"><h2 style="font-size:20px;margin-top:0">Resumo da encomenda</h2><div id="orderSummaryContent" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65"></div></section><a class="btn" href="/">Voltar à loja</a> <a class="btn" id="contactStore" href="https://wa.me/5561994022266" target="_blank" rel="noopener">Falar com a loja</a></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),id=query.get('order_id')||sessionStorage.getItem('lj-pedido-atual')||'',valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);let count=0;
function show(symbol,title,message,detail=''){$('symbol').textContent=symbol;$('title').textContent=title;$('message').textContent=message;$('detail').textContent=detail}

function orderDetails(){try{return JSON.parse(sessionStorage.getItem('lj-detalhes-pedido-'+id)||'null')}catch{return null}}
function confirmedDetails(){const d=orderDetails();if(!d)return;const a=d.endereco||{},c=d.cliente||{};const addr=[a.logradouro,a.numero,a.complemento,a.bairro,a.cidade,a.uf,a.cep?'CEP '+a.cep:''].filter(Boolean).join(', ');const products=(d.items||[]).map(p=>p.quantity+'x '+p.nome+' — '+Number(p.preco||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})).join('\\n');const lines=['Pedido: '+id,'Cliente: '+(c.nome||'Não informado'),'WhatsApp: '+(c.telefone||'Não informado'),'E-mail: '+(c.email||'Não informado'),'Produtos:',products||'Não informado','Endereço: '+(addr||'Não informado'),'Referência/observações: '+(a.observacoes||'Nenhuma'),'Pagamento: APROVADO pelo Mercado Pago'];$('orderSummaryContent').textContent=lines.join('\\n');$('orderSummary').hidden=false;const message='Olá! Meu pagamento foi confirmado na Lúcia Jacinta Crochê. Seguem os dados da encomenda:\\n\\n'+lines.join('\\n');$('contactStore').href='https://wa.me/5561994022266?text='+encodeURIComponent(message)}
if(!valid){show('🧾','Consulte seu pagamento','Não encontramos o identificador do pedido neste navegador. Se você pagou, consulte a compra no Mercado Pago ou fale com a loja.');return}
async function check(){try{const r=await fetch('/api/status-pedido?id='+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw Error('Falha na consulta');const data=await r.json();if(data.status==='approved'){show('✅','Pagamento confirmado!','Seu pagamento foi aprovado pelo Mercado Pago. Obrigado por comprar na Lúcia Jacinta Crochê!');sessionStorage.removeItem('lj-pedido-atual');localStorage.removeItem('lj-cart-v35');confirmedDetails();return}if(data.status==='rejected'||data.status==='cancelled'){show('⚠️','Pagamento não aprovado','O pagamento foi recusado ou cancelado. Você pode voltar à loja e tentar novamente.');return}if(data.status==='refunded'){show('↩️','Pagamento devolvido','O pagamento foi estornado. Entre em contato com a loja.');return}show('⏳','Aguardando confirmação do pagamento','Seu pedido foi registrado. Assim que o Mercado Pago confirmar o pagamento, esta tela será atualizada automaticamente.')}catch{show('⏳','Verificando pagamento','Não foi possível consultar a confirmação agora. Você pode aguardar ou consultar sua compra no Mercado Pago.')}
if(++count<120)setTimeout(check,5000);else $('detail').textContent='Se a confirmação demorar, consulte seu pagamento no Mercado Pago ou entre em contato com a loja.'}
check();
})();
</script></body></html>
