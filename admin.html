<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Lúcia Jacinta Crochê</title><link rel="stylesheet" href="/style.css?v=30"></head><body><header><h1>🧶 Administração — Lúcia Jacinta Crochê</h1><a href="/">Ver loja</a></header><main><p id="message" class="muted">Conectando...</p><section id="login" class="panel hidden"><h2>Entrar no painel</h2><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><section id="dashboard" class="hidden"><div class="panel"><div class="row"><h2>Produtos da loja</h2><button id="logout" class="secondary">Sair</button></div><p>Somente usuários autorizados podem editar produtos.</p></div><section class="panel"><h2 id="formTitle">Cadastrar produto</h2><form id="productForm"><input id="pid" type="hidden"><label>Nome<input id="nome" required maxlength="120"></label><label>Categoria<input id="categoria" required maxlength="80"></label><div class="row"><label>Preço (R$)<input id="preco" type="number" min="0" step="0.01" required></label><label>Estoque<input id="estoque" type="number" min="0" step="1" required></label></div><label>Imagem (URL HTTPS)<input id="imagem_url" type="url" placeholder="https://..."></label><label>Descrição<textarea id="descricao" rows="3"></textarea></label><label><input id="ativo" type="checkbox" checked style="display:inline;width:auto"> Produto ativo na loja</label><div class="actions"><button id="save" type="submit">Salvar produto</button><button type="button" id="clear" class="secondary">Limpar</button></div></form></section><section class="panel"><h2>Produtos cadastrados</h2><div id="list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/config.js?v=30"></script><script src="/admin.js?v=30"></script></body></html>
