<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Lúcia Jacinta Crochê</title><link rel="stylesheet" href="style.css?v=35"></head><body><header class="header"><a href="index.html" class="brand"><img src="assets/logo.jpg?v=35" alt="Logo"><span><strong>Lúcia Jacinta</strong><small>PAINEL ADMINISTRATIVO</small></span></a><a href="index.html">Ver loja ↗</a></header><main class="admin-shell"><section class="admin-card" id="loginSection"><h2>Entrar no painel</h2><form id="loginForm" class="admin-grid"><label>E-mail<input class="field" id="email" type="email" autocomplete="username" required></label><label>Senha<input class="field" id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Entrar</button></form></section><section id="dashboard" hidden><div class="admin-card"><h2>Produtos da loja</h2><p id="adminStatus" role="status"></p><button class="secondary-btn" id="logout">Sair do painel</button></div><section class="admin-card"><h2 id="formTitle">Cadastrar produto</h2><form id="productForm" class="admin-grid"><input type="hidden" id="productId"><label>Nome<input class="field" id="name" required maxlength="140"></label><label>Categoria<input class="field" id="category" placeholder="Tapetes, cozinha, banheiro..." required maxlength="80"></label><label>Preço (R$)<input class="field" id="price" type="number" step="0.01" min="0" required></label><label>Foto da galeria<input class="field" id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">Descrição<textarea class="field" id="description"></textarea></label><label><span>Disponível na loja</span><input id="active" type="checkbox" checked></label><div class="wide"><button class="btn" type="submit" id="saveProduct">Salvar produto</button> <button class="secondary-btn" type="button" id="cancelEdit">Cancelar edição</button></div></form></section><section class="admin-card"><h2>Produtos cadastrados</h2><div id="adminProducts" class="admin-list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js?v=35"></script><script src="admin.js?v=35"></script></body></html>
