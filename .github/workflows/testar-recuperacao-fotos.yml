
name: Testar recuperacao das fotos

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Validar senha
        run: |
          test -n "$BACKUP_PASSPHRASE"

      - name: Baixar ultimo backup das fotos
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/backup-fotos-supabase.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id')

          test -n "$RUN_ID"

          mkdir -p backup

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir backup

      - name: Descriptografar e verificar fotos
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find backup -type f \
            -name 'backup-fotos.tar.gz.enc' \
            -print -quit)

          test -n "$FILE"

          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -in "$FILE" \
            -out /tmp/fotos.tar.gz \
            -pass env:BACKUP_PASSPHRASE

          python3 - <<'PY'
          import tarfile
          import json
          import hashlib

          with tarfile.open('/tmp/fotos.tar.gz', 'r:gz') as tar:
              members = tar.getmembers()
              files = {}

              for member in members:
                  if not member.isfile():
                      raise ValueError("Entrada invalida")
                  name = member.name
                  if (
                      name.startswith("/")
                      or ".." in name.split("/")
                      or name in files
                  ):
                      raise ValueError("Caminho inseguro")
                  files[name] = member

              if "manifest.json" not in files:
                  raise ValueError("Manifesto ausente")

              manifest = json.load(
                  tar.extractfile(files["manifest.json"])
              )

              if manifest.get("bucket") != "produtos":
                  raise ValueError("Bucket incorreto")

              photos = manifest.get("files")
              if not isinstance(photos, list):
                  raise ValueError("Lista invalida")

              checked = set()
              total = 0

              for photo in photos:
                  path = photo["path"]
                  if (
                      not path
                      or path.startswith("/")
                      or ".." in path.split("/")
                  ):
                      raise ValueError("Caminho invalido")

                  name = "produtos/" + path
                  if name in checked or name not in files:
                      raise ValueError("Foto ausente ou duplicada")

                  checked.add(name)

                  digest = hashlib.sha256()
                  size = 0

                  with tar.extractfile(files[name]) as stream:
                      while True:
                          chunk = stream.read(1024 * 1024)
                          if not chunk:
                              break
                          digest.update(chunk)
                          size += len(chunk)

                  if size != photo["bytes"]:
                      raise ValueError("Tamanho incorreto")

                  if digest.hexdigest() != photo["sha256"]:
                      raise ValueError("Hash incorreto")

                  total += size

              if set(files) != checked | {"manifest.json"}:
                  raise ValueError("Arquivos inesperados")

              print("Fotos verificadas:", len(checked))
              print("Total de bytes:", total)
              print("Integridade confirmada!")
          PY

      - name: Limpar arquivos temporarios
        if: always()
        run: |
          rm -f /tmp/fotos.tar.gz
