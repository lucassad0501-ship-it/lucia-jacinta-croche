name: Backup criptografado das fotos Supabase
on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * *'
permissions:
  contents: read
jobs:
  backup-fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://wakhlrraspesozjlzxbs.supabase.co
      SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_BACKUP_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      STORAGE_BUCKET: produtos
    steps:
      - name: Validar configuracao
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_STORAGE_KEY" ]; then
            echo "::error::Cadastre SUPABASE_STORAGE_BACKUP_KEY nos Secrets do GitHub."
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Cadastre BACKUP_ENCRYPTION_PASSPHRASE nos Secrets do GitHub."
            exit 1
          fi
      - name: Baixar todas as fotos e criar pacote
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, tarfile, tempfile, hashlib, io
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_STORAGE_KEY']
          bucket=os.environ['STORAGE_BUCKET']
          headers={'apikey':key,'Authorization':'Bearer '+key}
          def request(url, body=None):
              h=dict(headers)
              if body is not None: h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=json.dumps(body).encode() if body is not None else None,headers=h,method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(req,timeout=60) as res: return res.read()
          def entries(prefix):
              offset=0
              while True:
                  url=base+'/storage/v1/object/list/'+urllib.parse.quote(bucket,safe='')
                  rows=json.loads(request(url,{'prefix':prefix,'limit':100,'offset':offset,'sortBy':{'column':'name','order':'asc'}}))
                  if not isinstance(rows,list): raise RuntimeError('Resposta inesperada do Storage')
                  for row in rows: yield row
                  if len(rows)<100: break
                  offset+=len(rows)
          pending=['']
          seen_dirs=set()
          seen_files=set()
          files=[]
          while pending:
              prefix=pending.pop()
              if prefix in seen_dirs: continue
              seen_dirs.add(prefix)
              for item in entries(prefix):
                  name=item.get('name','')
                  if not name or name in ('.','..'): continue
                  path=prefix+name
                  if item.get('id') is None:
                      pending.append(path+'/')
                  elif path not in seen_files:
                      seen_files.add(path)
                      files.append(path)
          manifest=[]
          with tarfile.open('backup-fotos.tar.gz','w:gz') as archive:
              for path in sorted(files):
                  url=base+'/storage/v1/object/'+urllib.parse.quote(bucket,safe='')+'/'+urllib.parse.quote(path,safe='/')
                  data=request(url)
                  digest=hashlib.sha256(data).hexdigest()
                  info=tarfile.TarInfo('produtos/'+path)
                  info.size=len(data)
                  info.mode=0o600
                  archive.addfile(info,io.BytesIO(data))
                  manifest.append({'path':path,'bytes':len(data),'sha256':digest})
              meta=json.dumps({'bucket':bucket,'files':manifest},ensure_ascii=False,indent=2).encode()
              info=tarfile.TarInfo('manifest.json')
              info.size=len(meta)
              info.mode=0o600
              archive.addfile(info,io.BytesIO(meta))
          print('Arquivos copiados:',len(manifest))
          print('Total de bytes:',sum(x['bytes'] for x in manifest))
          PY
          test -s backup-fotos.tar.gz
      - name: Criptografar e verificar pacote
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in backup-fotos.tar.gz -out backup-fotos.tar.gz.enc -pass env:BACKUP_PASSPHRASE
          test -s backup-fotos.tar.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup-fotos.tar.gz.enc -pass env:BACKUP_PASSPHRASE | tar -tzf - >/dev/null
          rm -f backup-fotos.tar.gz
      - name: Guardar fotos criptografadas por 14 dias
        uses: actions/upload-artifact@v4
        with:
          name: supabase-fotos-${{ github.run_id }}
          path: backup-fotos.tar.gz.enc
          retention-days: 14
          if-no-files-found: error
